        idempotency_key:
          type: string
          minLength: 1
        filename:
          type: string
          minLength: 1
        mime_type:
          type: string
          enum:
            - application/pdf
            - text/html
            - text/plain
            - text/markdown
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/xml
        file_content_base64:
          type: string
          minLength: 1
        legacy_import_acknowledged:
          type: boolean
          enum: [true]
        source_input_origin:
          type: string
          enum:
            - official_source_upload
        source_class:
          type: string
          enum:
            - tax_law
