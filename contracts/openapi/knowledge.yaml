        - idempotency_key
        - url
      properties:
        requested_by:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
          format: uri
        source_input_origin:
          type: string
          enum:
            - official_source_url
        source_class:
          type: string
          enum:
            - tax_law
            - regulation
            - guidance
            - commentary
    KnowledgeBulkIngestionFileItem:
      type: object
      additionalProperties: false
