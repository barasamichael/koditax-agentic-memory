      properties:
        acting_user:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/KnowledgeBulkIngestionUrlItem"
    KnowledgeReviewNote:
      type: object
      additionalProperties: true
    KnowledgeChunkPayload:
      type: object
      additionalProperties: false
