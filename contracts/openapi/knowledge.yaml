          type: string
        anchor_path:
          type: string
        anchor_text:
          type: string
        temporal_scope_from:
          type: string
          format: date
        temporal_scope_to:
          oneOf:
            - type: string
              format: date
            - type: "null"
        chunks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/KnowledgeChunkPayload"
    KnowledgePublicationPayload:
      type: object
      additionalProperties: false
      required:
        - source_id
        - source_family_id
        - title
        - source_class
        - authority_level
        - tax_domain
        - issuing_authority
        - point_in_time_url
        - source_version_form
        - effective_from
        - anchors
      properties:
        source_id:
          type: string
        source_family_id:
          type: string
        title:
          type: string
        source_class:
          type: string
          enum:
            - tax_law
            - regulation
            - guidance
            - commentary
        authority_level:
          type: string
          enum:
            - statute
            - regulation
            - guidance
            - commentary
        tax_domain:
          type: string
        issuing_authority:
          type: string
        point_in_time_url:
          type: string
          format: uri
        source_version_form:
          type: string
          enum:
            - as_issued
            - point_in_time_consolidation
          description: When the same governed family and effective window exist in both forms, `point_in_time_consolidation` is the preferred evidence form.
        effective_from:
          type: string
          format: date
        effective_to:
          oneOf:
            - type: string
              format: date
            - type: "null"
        tax_year:
          oneOf:
            - type: integer
            - type: "null"
        anchors:
          type: array
          minItems: 1
          items:
