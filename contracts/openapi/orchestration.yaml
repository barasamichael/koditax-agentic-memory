    UnifiedAnswerResponse:
      type: object
      additionalProperties: false
      description: >
        Additive user-facing answer section. `status=generated` means governed
        synthesis completed successfully. `status=failed` is the canonical
        degraded-safe fallback for disabled, blocked, or failed synthesis while
        preserving the structured execution envelope.
      required:
        - status
        - answer_text
        - answer_mode
        - citations
        - assumptions
        - warnings
        - integrity_signals
      properties:
        status:
          type: string
          enum: [generated, failed]
        answer_text:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
        answer_mode:
          type: string
          enum:
            - compute_execution
            - grounded_knowledge
            - compute_plus_grounding
            - forms_execution
            - reports_execution
            - document_extraction
            - unsupported
        citations:
          type: array
          items:
            $ref: "#/components/schemas/UnifiedAnswerCitation"
        source_references:
          type: array
          items:
            $ref: "#/components/schemas/UnifiedAnswerSourceReference"
        assumptions:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
          description: >
            Canonical synthesis warnings, including rollout-disabled or
            policy-blocked fallback disclosures when the answer is not
            generated.
        integrity_signals:
          $ref: "#/components/schemas/ResponseIntegritySignals"
    ContradictionFinding:
      type: object
      additionalProperties: false
      required:
        - claim_topic
        - source_a_id
        - source_a_value
        - source_b_id
        - source_b_value
      properties:
        claim_topic:
          type: string
        source_a_id:
          type: string
        source_a_value:
          type: string
        source_b_id:
          type: string
        source_b_value:
          type: string
    FactMismatch:
      type: object
      additionalProperties: false
      required:
        - field
        - prior_value
        - prior_execution_id
        - current_value
      properties:
        field:
          type: string
        prior_value: {}
        prior_execution_id:
          type: string
        current_value: {}
    ResponseIntegritySignals:
      type: object
      additionalProperties: false
      required:
        - verification_is_verified
        - verification_confidence
        - unsupported_claims
        - contradictions_found
        - grounding_contradictions
        - unverified_or_contradicting_user_facts
        - synthesis_tool_iterations_used
        - confidence_flag
      properties:
        verification_is_verified:
          type: boolean
          default: true
        verification_confidence:
          type: number
          default: 1.0
        unsupported_claims:
          type: array
          items:
            type: string
          default: []
        contradictions_found:
          type: array
          items:
            type: string
          default: []
        grounding_contradictions:
          type: array
          items:
            $ref: "#/components/schemas/ContradictionFinding"
          default: []
        unverified_or_contradicting_user_facts:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/FactMismatch"
              - type: string
          default: []
        synthesis_tool_iterations_used:
          type: integer
          default: 0
        confidence_flag:
          type: string
          enum: [high, medium, low]
          default: high
