openapi: 3.1.0
info:
  title: orchestration
  version: "0.1.0"
  description: >
    Deterministic orchestration runtime boundary for tax-domain-aware prompt execution planning.
    The implemented prompt execution path supports governed income-tax and
    health_contribution routing, plus governed knowledge lookup and timeline routing for
    supported authority and legal-reference prompts. The prompt-execution layer
    also supports governed multi-step execution plus additive OpenAI-backed
    user-facing answer synthesis from already-governed execution outputs across
    compute, knowledge, forms, reports, and document extraction lanes, plus
    bounded same-conversation follow-up resolution from prior governed
    execution context. Conversation continuity and response synthesis can be
    disabled by rollout or orchestration safety controls without disabling the
    underlying structured execution envelope. Release-gate, rollout-manifest,
    and post-deploy verification behavior remain internal helper surfaces in
    this slice rather than separate public orchestration endpoints.
paths:
  /healthz:
    get:
      summary: Orchestration service health check.
      operationId: orchestrationHealthz
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusResponse"
  /readyz:
    get:
      summary: Orchestration service readiness check.
      operationId: orchestrationReadyz
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
      responses:
        "200":
          description: Service is ready and returns additive rollout-surface metadata for internal-safe runtime inspection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusResponse"
  /v1/orchestration/income-tax/execute:
    post:
      summary: Build deterministic orchestration execution plan for the implemented income-tax prompt path.
      operationId: executeIncomeTaxOrchestration
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrchestrationExecuteRequest"
      responses:
        "200":
          description: Execution plan generated and validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchestrationExecuteResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /v1/orchestration/prompt/ingest:
    post:
      summary: Ingest deterministic chat prompt envelope at orchestration boundary.
      operationId: ingestOrchestrationPrompt
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptIngestionRequest"
      responses:
        "200":
          description: Prompt accepted for downstream orchestration lifecycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptIngestionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /v1/orchestration/prompt/decide:
    post:
      summary: Resolve deterministic intent/gate/route decision for prompt ingress and bounded same-conversation follow-up reuse.
      operationId: decideOrchestrationPromptRoute
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
        - $ref: "#/components/parameters/AuthContextHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptIngestionRequest"
      responses:
        "200":
          description: Prompt decision pipeline resolved to deterministic governed route selection or clarification-required follow-up outcome, including continuity-disabled or policy-blocked follow-up clarification paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDecisionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /v1/orchestration/prompt/execute:
    post:
      summary: Execute deterministic governed route-selected adapter dispatch with bounded same-conversation follow-up continuity and canonical fallback when synthesis is disabled or blocked.
      operationId: executeOrchestrationPromptRoute
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
        - $ref: "#/components/parameters/AuthContextHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptExecutionRequest"
      responses:
        "200":
          description: Selected route dispatched through deterministic adapter boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptExecutionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
  /v1/orchestration/prompt/execute/stream:
    post:
      summary: Execute a governed prompt and relay synthesis events.
      operationId: executeOrchestrationPromptStream
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
        - $ref: "#/components/parameters/AuthContextHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptExecutionRequest"
      responses:
        "200":
          description: Server-sent execution events ending with the execution envelope.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /v1/orchestration/conversations:
    get:
      summary: List browser-visible conversations from persisted orchestration state.
      operationId: listOrchestrationConversations
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
        - $ref: "#/components/parameters/AuthContextHeader"
      responses:
        "200":
          description: Conversation history hydration payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationHistoryListResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/orchestration/conversations/{conversation_id}:
    patch:
      summary: Rename one scoped conversation-state history set.
      operationId: renameOrchestrationConversation
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
        - $ref: "#/components/parameters/AuthContextHeader"
        - in: path
          name: conversation_id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationRenameRequest"
      responses:
        "200":
          description: Conversation-state records renamed or already using the requested title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRenameResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Delete one scoped conversation-state history set.
      operationId: deleteOrchestrationConversation
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
        - $ref: "#/components/parameters/AuthContextHeader"
        - in: path
          name: conversation_id
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Conversation-state records deleted or already absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDeleteResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/orchestration/conversations/bulk-delete:
    post:
      summary: Delete multiple scoped conversation-state history sets.
      operationId: bulkDeleteOrchestrationConversations
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
        - $ref: "#/components/parameters/AuthContextHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkConversationDeleteRequest"
      responses:
        "200":
          description: Conversation-state records deleted or already absent for the selected conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkConversationDeleteResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
components:
  parameters:
    CorrelationIdHeader:
      in: header
      name: X-Correlation-ID
      required: false
      schema:
        type: string
        minLength: 1
    TraceIdHeader:
      in: header
      name: X-Trace-ID
      required: false
      schema:
        type: string
        minLength: 1
    AuthContextHeader:
      in: header
      name: X-Auth-Context
      required: true
      schema:
        type: string
  responses:
    ErrorResponse:
      description: Canonical deterministic error envelope.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - detail
            properties:
              detail:
                $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error_code
        - message
        - reason
        - reason_code
        - correlation_id
        - trace_id
      properties:
        error_code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        reason_code:
          type: string
          minLength: 1
        correlation_id:
          type: string
          minLength: 1
        trace_id:
          type: string
        response_synthesis_enabled:
          type:
            - boolean
            - "null"
        conversation_continuity_enabled:
          type:
            - boolean
            - "null"
        release_gate_surface:
          type:
            - string
            - "null"
          minLength: 1
        context:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
    ServiceStatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - correlation_id
        - trace_id
      properties:
        status:
          type: string
          enum: [ok, ready]
        service:
          type: string
        version:
          type: string
        correlation_id:
          type: string
        trace_id:
          type: string
    OrchestrationExecuteRequest:
      type: object
      additionalProperties: false
      required:
        - prompt_text
      properties:
        prompt_text:
          type: string
          minLength: 1
        tenant_id:
          type: string
          minLength: 1
    OrchestrationResult:
      type: object
      additionalProperties: false
      required:
        - intent_class
        - supported_lane_id
        - historical_version_id
        - tax_year
        - plan_id
        - plan_status
        - validation_status
      properties:
        intent_class:
          type: string
        supported_lane_id:
          type: string
        historical_version_id:
          type: string
        tax_year:
          type: integer
        plan_id:
          type: string
        plan_status:
          type: string
        validation_status:
          type: string
    OrchestrationExecuteResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - correlation_id
        - trace_id
        - result
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        correlation_id:
          type: string
        trace_id:
          type: string
        result:
          $ref: "#/components/schemas/OrchestrationResult"
    PromptPayload:
      type: object
      additionalProperties: false
      required:
        - text
        - format
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        format:
          type: string
          enum: [plain_text]
    PromptIngestionRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - conversation_id
        - channel
        - prompt
      properties:
        tenant_id:
          type: string
          minLength: 1
          maxLength: 128
        conversation_id:
          type: string
          minLength: 1
          maxLength: 128
        channel:
          type: string
          enum: [chat]
        prompt:
          $ref: "#/components/schemas/PromptPayload"
    PromptIngestionResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - correlation_id
        - trace_id
        - ingestion_id
        - tenant_id
        - conversation_id
        - channel
        - prompt_format
        - prompt_checksum
      properties:
        status:
          type: string
          enum: [accepted]
        service:
          type: string
        correlation_id:
          type: string
          minLength: 1
        trace_id:
          type: string
          minLength: 1
        ingestion_id:
          type: string
          minLength: 64
          maxLength: 64
        tenant_id:
          type: string
          minLength: 1
          maxLength: 128
        conversation_id:
          type: string
          minLength: 1
          maxLength: 128
        channel:
          type: string
          enum: [chat]
        prompt_format:
          type: string
          enum: [plain_text]
        prompt_checksum:
          type: string
          minLength: 64
          maxLength: 64
    OrchestrationRouteSelection:
      type: object
      additionalProperties: false
      required:
        - route_id
        - target_service
        - target_operation
      properties:
        route_id:
          type: string
          minLength: 1
        target_service:
          type: string
          minLength: 1
        target_operation:
          type: string
          minLength: 1
    OrchestrationPlanStep:
      type: object
      additionalProperties: false
      required:
        - step_id
        - route_id
        - target_service
        - target_operation
        - step_status
        - depends_on
      properties:
        step_id:
          type: string
          minLength: 1
        route_id:
          type: string
          minLength: 1
        target_service:
          type: string
          minLength: 1
        target_operation:
          type: string
          minLength: 1
        step_status:
          type: string
          minLength: 1
        depends_on:
          type: array
          items:
            type: string
        step_purpose:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
    OrchestrationExecutionPlan:
      type: object
      additionalProperties: false
      required:
        - plan_id
        - plan_version
        - plan_status
        - planning_mode
        - execution_ready
        - steps
      properties:
        plan_id:
          type: string
          minLength: 1
        plan_version:
          type: string
          minLength: 1
        plan_status:
          type: string
          minLength: 1
        planning_mode:
          type: string
          enum: [single_step, multi_step, clarification_required]
        execution_ready:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OrchestrationPlanStep"
    OrchestrationStepExecutionResult:
      type: object
      additionalProperties: false
      required:
        - step_id
        - route_id
        - target_service
        - target_operation
        - step_status
        - depends_on
        - execution_id
        - mapped_result
        - adapter_response
        - error
      properties:
        step_id:
          type: string
          minLength: 1
        route_id:
          type: string
          minLength: 1
        target_service:
          type: string
          minLength: 1
        target_operation:
          type: string
          minLength: 1
        step_status:
          type: string
          enum: [planned, running, resolved, blocked, rejected]
        depends_on:
          type: array
          items:
            type: string
        step_purpose:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
        execution_id:
          type: [string, "null"]
        mapped_result:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        adapter_response:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
    OrchestrationStepExecutionSummary:
      type: object
      additionalProperties: false
      required:
        - total_steps
        - resolved_steps
        - blocked_steps
        - rejected_steps
        - pending_steps
        - accepted_steps
      properties:
        total_steps:
          type: integer
          minimum: 0
        resolved_steps:
          type: integer
          minimum: 0
        blocked_steps:
          type: integer
          minimum: 0
        rejected_steps:
          type: integer
          minimum: 0
        pending_steps:
          type: integer
          minimum: 0
        accepted_steps:
          type: integer
          minimum: 0
    PromptClarificationRequirement:
      type: object
      additionalProperties: false
      required:
        - reason_code
        - message
        - required_context_fields
        - candidate_service_families
      properties:
        reason_code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        required_context_fields:
          type: array
          items:
            type: string
        candidate_service_families:
          type: array
          items:
            type: string
    PromptDecisionResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - correlation_id
        - trace_id
        - decision_id
        - prompt_checksum
        - intent_class
        - tax_domain_hint
        - gate_status
        - plan
      properties:
        status:
          type: string
          enum: [resolved, clarification_required]
        service:
          type: string
        correlation_id:
          type: string
          minLength: 1
        trace_id:
          type: string
          minLength: 1
        decision_id:
          type: string
          minLength: 64
          maxLength: 64
        prompt_checksum:
          type: string
          minLength: 64
          maxLength: 64
        intent_class:
          type: string
          minLength: 1
        tax_domain_hint:
          type: string
          minLength: 1
        supported_lane_id:
          type: [string, "null"]
          minLength: 1
        historical_version_id:
          type: [string, "null"]
          minLength: 1
        regime_identifier:
          type: [string, "null"]
          minLength: 1
        gate_status:
          type: string
          enum: [allowed, plan_only, clarification_required]
        selected_route:
          oneOf:
            - $ref: "#/components/schemas/OrchestrationRouteSelection"
            - type: "null"
        plan:
          $ref: "#/components/schemas/OrchestrationExecutionPlan"
        clarification:
          oneOf:
            - $ref: "#/components/schemas/PromptClarificationRequirement"
            - type: "null"
    PromptExecutionRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - conversation_id
        - channel
        - prompt
        - idempotency_key
        - intent_class
        - tax_domain_hint
        - decision_id
        - selected_route
      properties:
        tenant_id:
          type: string
          minLength: 1
          maxLength: 128
        conversation_id:
          type: string
          minLength: 1
          maxLength: 128
        channel:
          type: string
          enum: [chat]
        prompt:
          $ref: "#/components/schemas/PromptPayload"
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        intent_class:
          type: string
          minLength: 1
          maxLength: 128
        tax_domain_hint:
          type: string
          minLength: 1
          maxLength: 128
        decision_id:
          type: string
          minLength: 64
          maxLength: 64
        selected_route:
          oneOf:
            - $ref: "#/components/schemas/OrchestrationRouteSelection"
            - type: "null"
        action_context:
          $ref: "#/components/schemas/OrchestrationActionSafetyContext"
    OrchestrationActionSafetyContext:
      type: object
      additionalProperties: false
      required:
        - risk_class
        - confirmation_state
        - step_up_proof_state
      properties:
        risk_class:
          type: string
          enum: [low, high]
        confirmation_state:
          type: string
          enum: [confirmed, pending, unknown]
        step_up_proof_state:
          type: string
          enum: [bound, unbound, not_required]
    GovernedValidationIssue:
      type: object
      additionalProperties: false
      required:
        - severity
        - code
        - message
        - field
      properties:
        severity:
          type: string
          enum: [ERROR, WARNING, INFO]
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        field:
          oneOf:
            - type: string
            - type: "null"
    GovernedValidationRuleResult:
      type: object
      additionalProperties: false
      required:
        - rule_code
        - outcome
        - severity
        - message
        - field
        - linked_issue_codes
      properties:
        rule_code:
          type: string
          minLength: 1
        outcome:
          type: string
          enum: [passed, failed, not_applicable]
        severity:
          type: string
          enum: [ERROR, WARNING, INFO]
        message:
          type: string
          minLength: 1
        field:
          oneOf:
            - type: string
            - type: "null"
        linked_issue_codes:
          type: array
          items:
            type: string
    GovernedValidationSummary:
      type: object
      additionalProperties: false
      required:
        - error_count
        - warning_count
        - info_count
        - total_issues
      properties:
        error_count:
          type: integer
        warning_count:
          type: integer
        info_count:
          type: integer
        total_issues:
          type: integer
    GovernedValidationEnvelope:
      type: object
      additionalProperties: false
      required:
        - workflow
        - tax_domain
        - validation_status
        - summary
        - issues
        - rule_results
      properties:
        workflow:
          type: string
          minLength: 1
        tax_domain:
          type: string
          enum: [income_tax, health_contribution]
        validation_status:
          type: string
          enum: [accepted, rejected]
        summary:
          $ref: "#/components/schemas/GovernedValidationSummary"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/GovernedValidationIssue"
        rule_results:
          type: array
          items:
            $ref: "#/components/schemas/GovernedValidationRuleResult"
    PromptExecutionResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - correlation_id
        - trace_id
        - execution_id
        - decision_id
        - prompt_checksum
        - plan
        - selected_route
        - execution_status
        - mapped_result
        - response
        - final_outcome
      properties:
        status:
          type: string
          enum: [executed]
        service:
          type: string
        correlation_id:
          type: string
          minLength: 1
        trace_id:
          type: string
          minLength: 1
        execution_id:
          type: string
          minLength: 64
          maxLength: 64
        decision_id:
          type: string
          minLength: 64
          maxLength: 64
        prompt_checksum:
          type: string
          minLength: 64
          maxLength: 64
        tax_domain_hint:
          type: string
          minLength: 1
        supported_lane_id:
          type: [string, "null"]
          minLength: 1
        historical_version_id:
          type: [string, "null"]
          minLength: 1
        regime_identifier:
          type: [string, "null"]
          minLength: 1
        plan:
          $ref: "#/components/schemas/OrchestrationExecutionPlan"
        grounding_status:
          type: [string, "null"]
