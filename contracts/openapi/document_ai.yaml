openapi: 3.1.0
info:
  title: document_ai
  version: "1.0.0"
  description: >
    Governed Document Processing and Management Module contract for Phase B production closure.
    This contract covers upload-session flow, target processing, and document evidence retrieval.

    Supported families: PDFs; Word documents (DOCX, ODT, RTF); spreadsheets
    (XLSX, ODS, CSV, TSV); presentations (PPTX, ODP); text and structured data
    (TXT, Markdown, JSON, XML); and PNG, JPEG, WebP, and TIFF images. The
    platform accepts sources up to 200 MB through direct Cloudflare R2 upload.
    Source inspection confirms signatures, safe containers, and content before
    any provider processing; unsafe binaries and archives are rejected.

    Source inspection validates supported document structure before any provider call.

    Storage boundary: production requires PostgreSQL persistence and private Cloudflare R2 object
    storage; local/in-memory adapters are non-production only. Storage keys are tenant-scoped
    and enforced at upload completion. Signed download capabilities are HMAC-SHA256 tokens
    with a 15-minute TTL and are single-use. Reuse is rejected with reason
    capability_already_consumed.

    Auth and role boundaries: IndividualTaxpayer performs document operations and may request
    compliance overrides. ComplianceOfficer approves or rejects compliance overrides only.
    Owner and tenant scoping is enforced on all mutation endpoints except compliance-override
    approve and reject.
paths:
  /v1/documents:
    get:
      summary: List canonical document metadata scoped to authenticated owner and tenant.
      operationId: listDocumentRecords
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentStateQuery"
        - $ref: "#/components/parameters/UploadedFromQuery"
        - $ref: "#/components/parameters/UploadedToQuery"
        - $ref: "#/components/parameters/ComputationIdQuery"
      responses:
        "200":
          description: Scoped documents list found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /v1/document-bindings:
    post:
      summary: Create or replay a durable document-to-conversation or workflow binding.
      operationId: createDocumentBinding
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentBindingRequest"
      responses:
        "201":
          description: Durable binding created or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentBindingEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
    get:
      summary: Reload durable bindings for one conversation, turn, or workflow.
      operationId: listDocumentBindings
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - in: query
          name: conversation_id
          required: false
          schema:
            type: string
            minLength: 1
        - in: query
          name: turn_id
          required: false
          schema:
            type: string
            minLength: 1
        - in: query
          name: workflow_id
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Authorized bindings in deterministic attachment order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentBindingListEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /v1/document-evidence/exact-retrievals:
    post:
      summary: Retrieve exact active canonical chunks inside the authorized document scope.
      description: >
        Performs metadata, lexical, and structural matching over active canonical content.
        It does not use pgvector and never returns semantic candidates.
      operationId: retrieveExactDocumentEvidence
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExactRetrievalRequest"
      responses:
        "200":
          description: Active canonical chunks resolved within the authorized scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExactRetrievalEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/document-evidence/semantic-retrievals:
    post:
      summary: Discover authorized semantic candidates using CockroachDB vector search.
      description: >
        OpenAI query embeddings and CockroachDB native vector search discover only active,
        eligible retrieval chunks. Returned values preserve chunk and source lineage and are
        not evidence or factual claims.
      operationId: retrieveSemanticDocumentCandidates
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticRetrievalRequest"
      responses:
        "200":
          description: Authorized semantic discovery candidates; not evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticRetrievalEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/document-evidence/hybrid-retrievals:
    post:
      summary: Retrieve deterministically fused hybrid candidates.
      description: >
        Combines the semantic candidate boundary with a lexical exact probe on the same
        query text, deduplicates by retrieval chunk identity, and fuses the two ranked
        candidate sets deterministically. It preserves branch provenance and raw score
        semantics instead of collapsing them into one blended retrieval score.
      operationId: retrieveHybridDocumentCandidates
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticRetrievalRequest"
      responses:
        "200":
          description: Authorized fused candidates; not evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HybridRetrievalEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/upload-sessions:
    post:
      summary: Create a deterministic upload session for one document.
      description: >
        Side-effect operation. Idempotency-Key is required. Reusing the same
        Idempotency-Key with the same logical request must return an equivalent
        response; conflicting reuse must return a deterministic error.
      operationId: createDocumentUploadSession
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSessionCreateRequest"
      responses:
        "201":
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}/upload-completion:
    post:
      summary: Mark upload completion and bind deterministic upload evidence.
      description: >
        Side-effect operation. Idempotency-Key is required and governs replay/conflict
        behavior for this completion event. When the upload session selected a supported
        target source-inspection and processing work through the document_ai runtime path.
      operationId: completeDocumentUpload
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompletionRequest"
      responses:
        "200":
          description: Upload completion registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecordEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}:
    get:
      summary: Retrieve canonical document metadata and lifecycle state.
      operationId: getDocumentRecord
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
      responses:
        "200":
          description: Document metadata found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecordEnvelope"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      summary: Update approved user-facing document metadata with optimistic concurrency.
      operationId: updateDocumentMetadata
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentMetadataUpdateRequest"
      responses:
        "200":
          description: Metadata updated or safely replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecordEnvelope"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}/download-capabilities:
    post:
      summary: Issue short-lived signed download capability for one scoped document.
      operationId: issueDocumentDownloadCapability
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
      responses:
        "201":
          description: Signed download capability issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedDownloadCapabilityEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}/download-capabilities/validate:
    post:
      summary: Validate one signed download capability usage against scoped request context.
      operationId: validateDocumentDownloadCapability
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedDownloadCapabilityValidationRequest"
      responses:
        "200":
          description: Signed download capability validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedDownloadCapabilityValidationEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}/compliance-overrides:
    post:
      summary: Request compliance-lock override for a scoped high-risk lifecycle action.
      operationId: requestDocumentComplianceOverride
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceOverrideRequestPayload"
      responses:
        "201":
          description: Compliance override request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceOverrideResponseEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}/compliance-overrides/{override_id}/approve:
    post:
      summary: Approve pending compliance override with independent authorized actor.
      operationId: approveDocumentComplianceOverride
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
        - $ref: "#/components/parameters/ComplianceOverrideIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceOverrideDecisionPayload"
      responses:
        "200":
          description: Compliance override approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceOverrideResponseEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}/compliance-overrides/{override_id}/reject:
    post:
      summary: Reject pending compliance override with independent authorized actor.
      operationId: rejectDocumentComplianceOverride
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
        - $ref: "#/components/parameters/ComplianceOverrideIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceOverrideDecisionPayload"
      responses:
        "200":
          description: Compliance override rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceOverrideResponseEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}/trash:
    post:
      summary: Apply deterministic trash action for one tenant/owner-scoped document.
      operationId: trashDocumentRecord
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
        - $ref: "#/components/parameters/ComplianceOverrideIdQuery"
      responses:
        "200":
          description: Document transitioned to trash-equivalent lifecycle state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecordEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}/restore:
    post:
      summary: Apply deterministic restore action for one tenant/owner-scoped document.
      operationId: restoreDocumentRecord
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
        - $ref: "#/components/parameters/ComplianceOverrideIdQuery"
      responses:
        "200":
          description: Document restored when supported by lifecycle model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecordEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}/purge-eligibility:
    post:
      summary: Mark a scoped document as eligible_for_purge with explicit deterministic timestamp.
      operationId: markDocumentEligibleForPurge
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
        - $ref: "#/components/parameters/ComplianceOverrideIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeEligibilityMarkRequest"
      responses:
        "200":
          description: Document transitioned to eligible_for_purge under temporal constraints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecordEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}/purge:
    post:
      summary: Execute deterministic purge transition for one eligible scoped document.
      operationId: executeDocumentPurge
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
        - $ref: "#/components/parameters/ComplianceOverrideIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeExecutionRequest"
      responses:
        "200":
          description: Document transitioned to purged under lifecycle and temporal constraints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecordEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /v1/documents/{document_id}/purge-dry-run:
    post:
      summary: Evaluate deterministic purge safety checks without mutating lifecycle state.
      operationId: dryRunDocumentPurgeSafety
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/DocumentIdPath"
      responses:
        "200":
          description: Deterministic purge safety readiness report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPurgeSafetyDryRunEnvelope"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
components:
  parameters:
    AuthorizationHeader:
      in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: Bearer token in "<uuid>:<role>" format.
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: >
        Stable key for deterministic replay behavior on side-effect operations.
        Same key + same logical request should replay; same key + different request
        should conflict.
    CorrelationIdHeader:
      in: header
      name: X-Correlation-ID
      required: false
      schema:
        type: string
      description: Optional caller-provided correlation identifier.
    TenantIdQuery:
      in: query
      name: tenant_id
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
      description: Required tenant scope identifier for deterministic read-path ownership checks.
    DocumentStateQuery:
      in: query
      name: state
      required: false
      schema:
        type: string
        enum:
          - uploaded
          - processing
          - validated
          - eligible_for_purge
          - purged
      description: Optional lifecycle-state filter.
    UploadedFromQuery:
      in: query
      name: uploaded_from
      required: false
      schema:
        type: string
        format: date-time
      description: Optional inclusive lower-bound upload timestamp filter.
    UploadedToQuery:
      in: query
      name: uploaded_to
      required: false
      schema:
        type: string
        format: date-time
      description: Optional inclusive upper-bound upload timestamp filter.
    ComputationIdQuery:
      in: query
      name: computation_id
      required: false
      schema:
        type: string
        minLength: 1
      description: Optional computation linkage identifier filter.
    DocumentIdPath:
      in: path
      name: document_id
      required: true
      schema:
        type: string
        format: uuid
    LinkageIdPath:
      in: path
      name: linkage_id
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{64}$"
    ComplianceOverrideIdPath:
      in: path
      name: override_id
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{64}$"
    ComplianceOverrideIdQuery:
      in: query
      name: compliance_override_id
      required: false
      schema:
        type: string
        pattern: "^[a-f0-9]{64}$"
      description: Optional approved compliance-override grant for active lock bypass.
  responses:
    ErrorResponse:
      description: Deterministic structured error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    DocumentBindingRequest:
      type: object
      additionalProperties: false
      required:
        - document_id
        - binding_role
      properties:
        document_id:
          type: string
          format: uuid
        document_version_id:
          type:
            - string
            - "null"
          format: uuid
        binding_role:
          type: string
          enum:
            - conversation_attachment
            - current_turn_attachment
            - existing_library_document
            - workflow_reference
        conversation_id:
          type:
            - string
            - "null"
          minLength: 1
        turn_id:
          type:
            - string
            - "null"
          minLength: 1
        workflow_id:
          type:
            - string
            - "null"
          minLength: 1
        attachment_order:
          type:
            - integer
            - "null"
          minimum: 0
    DocumentBindingRecord:
      type: object
      additionalProperties: false
      required:
        - document_binding_id
        - tenant_id
        - document_id
        - binding_role
        - bound_by_user_id
        - bound_at
        - correlation_id
      properties:
        document_binding_id:
          type: string
          format: uuid
        tenant_id:
          type: string
        document_id:
          type: string
          format: uuid
        document_version_id:
          type:
            - string
            - "null"
          format: uuid
        resolved_document_version_id:
          type:
            - string
            - "null"
          format: uuid
        binding_role:
          type: string
        conversation_id:
          type:
            - string
            - "null"
        turn_id:
          type:
            - string
            - "null"
